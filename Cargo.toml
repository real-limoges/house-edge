[workspace]
# site/native/houseedge_nif joins the members once that crate builds; listing
# it before then would fail the workspace resolve.
members = ["engine", "engine-wasm"]
resolver = "2"

# `release` must unwind: the NIF relies on catch_unwind, and an abort takes
# down the BEAM node. So wasm gets its own profile.
[profile.release]
opt-level = 3
lto = true

[profile.release-wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
